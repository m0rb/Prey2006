name: OpenBSD Auto-Builds

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - .github/workflows/Linux.yml
      - .github/workflows/Windows.yml
  pull_request:
    types: [edited, opened, synchronize]
    paths-ignore:
      - .github/workflows/Linux.yml
      - .github/workflows/Windows.yml
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: OpenBSD Auto-Build (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            release: "7.6"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          prepare: |
            attempt=0
            until [ "$attempt" -ge 3 ]
            do
              pkg_add -I cmake ccache pkgconf ninja openal sdl2 tree zip git && break
              attempt=$((attempt+1))
              echo "pkg_add failed, retrying ($attempt/3)" >&2
              sleep $((attempt * 5))
            done
          run: |
            echo "::group::Configure"
            mkdir -p build
            cd build
            cmake -G Ninja -DDEDICATED=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ../neo/
            echo "::endgroup::"
            echo "::group::Build"
            ninja
            echo "::endgroup::"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prey2006-openbsd-${{ matrix.arch }}
          path: output/openbsd/
          compression-level: 6
